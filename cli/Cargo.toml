[package]
name = "cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "chunker"
path = "src/main.rs"

[dependencies]
chunker-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3"
